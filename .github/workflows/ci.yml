name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Read-only token: nothing here writes to the repository, and a push-to-main
# run executes every devDependency's lifecycle scripts.
permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # The advisory leg (next-major Node) reports but never blocks a merge;
    # every other leg is blocking. See docs/ROADMAP.md § Phase 0.
    continue-on-error: ${{ matrix.advisory == true }}
    strategy:
      # A red advisory leg must not cancel the blocking ones.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          # One macOS leg (the development platform) on the .nvmrc Node.
          - os: macos-latest
            node: 24
          # Advisory early-warning leg on the next major. It may fail because
          # the release does not exist yet, or on a genuine forward-compat
          # break — either way it is informational. It runs the full
          # `npm run check` (coverage:run + coverage:gate included); only the
          # separate coverage step and the Codecov upload are ubuntu/22-only.
          - os: ubuntu-latest
            node: 26
            advisory: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: ${{ matrix.advisory == true }}
          cache: npm
      - run: npm ci
      # Full gate: typecheck + lint + format:check + build + test.
      - run: npm run check
      # Coverage — thresholds are enforced by .c8rc.json. Runs once, on the
      # ubuntu/Node 22 leg.
      - if: matrix.node == 22 && matrix.os == 'ubuntu-latest'
        run: npm run coverage
      # Upload the lcov report to Codecov (public repo, tokenless). Non-blocking:
      # a Codecov outage must not fail CI. Runs once, on the same ubuntu/Node 22 leg.
      - if: matrix.node == 22 && matrix.os == 'ubuntu-latest'
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
      # Production-dependency audit: fail on high+ advisories.
      - if: matrix.node == 22 && matrix.os == 'ubuntu-latest'
        run: npm audit --omit=dev --audit-level=high

  # Windows run (win32 path/line-ending safety). LF is enforced so the generated
  # docs stay byte-identical to their LF originals on the Windows checkout; lint
  # and format run here too, so style consistency is proven on win32 paths.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  # What the pack-audit gate cannot prove: that the tarball *runs*. This packs the
  # repo, installs the tarball into a temp prefix outside it, and drives the
  # installed binary — --version/--help/usage exit code, then a real JSON-RPC
  # handshake (initialize, initialized, tools/list) over stdio with stdout purity
  # asserted (CC-G3). All three OSes, because the failures it catches — a missing
  # file in `files`, a path that only resolves from the repo layout, a win32 shim
  # difference — are platform-shaped. Not in `npm run check`: it installs from the
  # network, and `check` stays offline-safe.
  smoke-pack:
    runs-on: ${{ matrix.os }}
    strategy:
      # One red platform must not hide the state of the other two.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The tarball ships `build/src`, so the build has to precede the pack.
      - run: npm run build
      - run: npm run smoke:pack

  # The bin launcher must print a human message (not a SyntaxError) under ancient
  # Node and exit non-zero.
  launcher-node12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No container: checkout runs under the runner's modern Node; setup-node
      # then installs the old runtime so only the launcher probe runs on it.
      # (A node:12 container cannot run the Node 24 that powers checkout.)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 12
      - run: |
          set +e
          out=$(node bin/tiktok-mcp-ai.cjs 2>&1)
          code=$?
          echo "$out"
          test $code -ne 0 || exit 1
          echo "$out" | grep -q "requires Node.js >= 22" || exit 1
