# Static analysis (SAST) on push/PR plus a weekly cron, so advisories in
# unchanged code still surface. TypeScript is covered by the javascript-typescript
# CodeQL language, which analyses source directly: `build-mode: none` says so
# explicitly, so no `autobuild` step runs and CodeQL never competes with `tsc`
# for the build/ directory.
name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday 06:17 UTC

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the SARIF result to the Security tab
      actions: read # read workflow run status (required by codeql-action)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:javascript-typescript
