name: Publish

# Publish to npm from CI on a version tag (never from a laptop).
#
# Two gates run before anything leaves the runner: `release:guard` (the tag,
# every version field and the changelog agree — see scripts/release-guard.ts)
# and the full `npm run check`. The guard runs first because it costs a second
# and the suite costs minutes, and a version skew is not going to fix itself
# halfway through the tests.
#
# Authentication is npm **trusted publishing**: there is no NPM_TOKEN anywhere
# in this workflow. The registry trusts this repository + workflow filename via
# OIDC, which is also what provenance is attested from — a token would be both
# unnecessary and a thing that can leak.
#
# Do not rename or move this workflow: publish-mcp.yml and publish-vscode.yml
# trigger on `workflows: [Publish]` and accept only a run whose path is
# .github/workflows/publish.yml.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release from the changelog section
  id-token: write # npm trusted publishing + provenance (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The write token must not sit in .git/config while `npm ci` runs every
          # devDependency's lifecycle scripts; `gh release` reads GH_TOKEN instead.
          persist-credentials: false
      # v7+ is required: older setup-node exported a placeholder NODE_AUTH_TOKEN,
      # and npm treats any token it finds as "already authenticated" and never
      # reaches for OIDC. `registry-url` is deliberately omitted for the same
      # reason — it writes an _authToken line into .npmrc. The default registry
      # is registry.npmjs.org regardless.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # Node 22 ships npm 10.x; trusted publishing needs >= 11.5.1. Pinned: the
      # npm that runs next to an OIDC-capable job is not a floating dependency.
      - run: npm install -g npm@12.1.0
      - run: npm ci
      # The guard runs from build/, like every other script in scripts/.
      - run: npm run build
      - name: Release identity gate (tag ⇄ versions ⇄ CHANGELOG)
        run: npm run release:guard
      - run: npm run check
      # Last gate before the registry: pack the tree, install that tarball into a
      # temp prefix and drive the installed binary through a real MCP handshake.
      # `check` cannot cover this — it tests the repo layout, and what ships is
      # the `files` subset. No credentials are involved (the install only reads
      # the public registry for the runtime deps) and nothing is published here;
      # `npm publish` below packs its own tarball from the same clean tree.
      - run: npm run smoke:pack
      # A prerelease tag must not land on `latest`, or every `npx tiktok-mcp-ai`
      # in the world silently upgrades to a release candidate.
      # Captured first: inside `echo "…$(…)" >> "$GITHUB_ENV"` a failing guard
      # would lose its exit status and publish under an empty tag.
      - name: Resolve the npm dist-tag
        run: |
          dist_tag=$(node build/scripts/release-guard.js --dist-tag)
          if [ -z "$dist_tag" ]; then
            echo "release-guard printed no dist-tag" >&2
            exit 1
          fi
          echo "DIST_TAG=$dist_tag" >> "$GITHUB_ENV"
      # The first version is published by hand (trusted publishing cannot create
      # a package), so its tag reaches `npm publish` with the version already
      # on the registry — E403, no GitHub release, no followers. The same goes
      # for re-running a run whose GitHub release step failed after npm. This
      # step skips the publish only on proof: `npm view` of the exact version
      # answers that version, its `gitHead` is this commit, and the registry
      # tarball holds the same files as this commit's `npm pack`. E404 means
      # publish; any other registry failure, or a published version that does
      # not match, fails the run instead of guessing either way. A skip cannot
      # set the dist-tag (OIDC authorizes `npm publish` only), so it warns when
      # the tag is elsewhere and fails when a prerelease holds `latest`. Read
      # from the public registry, no credentials — scripts/registry-state.ts.
      - name: Skip npm publish if this exact version is already published
        id: registry
        run: node build/scripts/registry-state.js
      # `!= 'true'` rather than `== 'false'`: a missing output publishes, and
      # the registry then refuses a duplicate — it never skips by accident.
      - if: ${{ steps.registry.outputs.skip != 'true' }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"
      # After npm, never before — published above, or verified on the registry
      # by the skip step: a GitHub release pointing at a version the registry
      # does not have is worse than no release at all.
      - name: GitHub release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node build/scripts/release-guard.js --notes > "$RUNNER_TEMP/notes.md"
          prerelease=""
          if [ "$DIST_TAG" != "latest" ]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" $prerelease
