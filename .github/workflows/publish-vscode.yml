name: Publish VS Code Extension

# Publish the VS Code extension (extension/) to the Visual Studio Marketplace.
# Runs on a version tag (alongside the npm "Publish" workflow) and on demand via
# workflow_dispatch (for the first publish or a re-run). Authentication uses the
# VSCE_PAT repo secret (Azure DevOps PAT, scope Marketplace > Manage); the token
# never touches a laptop or the logs.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      # The extension version must match the root package version, so the
      # Marketplace can never lag behind an npm release. The authoritative
      # check — tag, both package.json files, server.json, the plugin manifest
      # and CHANGELOG.md all agreeing — is `npm run release:guard` in
      # publish.yml; this job only installs extension/, so it re-checks the one
      # pair it can see rather than paying for a root install to learn the same.
      - name: Check version sync with the root package
        run: |
          root=$(node -p "require('../package.json').version")
          ext=$(node -p "require('./package.json').version")
          if [ "$root" != "$ext" ]; then
            echo "Version skew: root $root vs extension $ext" >&2
            exit 1
          fi
      - run: npm run compile
      - name: Publish to the Marketplace
        run: npx vsce publish --no-dependencies -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
